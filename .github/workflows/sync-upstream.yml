name: Sync and release official Global

on:
  schedule:
    # 09:00 and 18:00 Asia/Bangkok (02:00 and 11:00 UTC).
    - cron: '0 2,11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-global
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Check official Global version
        id: upstream
        run: |
          mkdir -p .work
          node scripts/sync-upstream.mjs --check > .work/upstream-check.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('.work/upstream-check.json', 'utf8'));
          if (typeof result.changed !== 'boolean' || !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(result.latestVersion)) throw new Error('Invalid official version response');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.changed}\nversion=${result.latestVersion}\n`);
          NODE
      - name: Install build tools
        if: steps.upstream.outputs.changed == 'true'
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          brew install sevenzip
      - uses: actions/cache/restore@v4
        id: cargo-cache
        if: steps.upstream.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-rust-1.97.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Validate updated official resources
        if: steps.upstream.outputs.changed == 'true'
        env:
          GLOBAL_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          npm ci
          node scripts/sync-upstream.mjs --update-lock
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'src-tauri/tauri.conf.json';
          const version = process.env.GLOBAL_VERSION;
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) throw new Error(`Invalid Global version: ${version}`);
          const config = JSON.parse(await readFile(path, 'utf8'));
          config.version = version;
          await writeFile(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          npm run icons
          npm run prepare:frontend
          npm test
      - name: Test native backend
        id: native-tests
        if: steps.upstream.outputs.changed == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native application
        if: steps.upstream.outputs.changed == 'true'
        run: npm run build -- -- --locked
      - name: Package candidate
        id: validate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          bash scripts/package-macos.sh 2>&1 | tee .work/package-macos.log
      - name: Keep validated packages for audit
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: official-global-release-candidate
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled Cargo dependencies
        if: always() && steps.native-tests.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Commit lock and publish automatic release
        if: steps.validate.outcome == 'success'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git add upstream-global.json src-tauri/tauri.conf.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: sync official Global resources ${VERSION}"
          git push origin HEAD:main

          # Deployment tags mirror the official Global resource version.
          git fetch --tags --force origin
          TAG="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Release tag ${TAG} already exists; refusing to overwrite it automatically." >&2
            exit 1
          fi
          COMMIT=$(git rev-parse HEAD)
          git tag -a "$TAG" "$COMMIT" -m "Release Wuwa Tappo Global Mac ${TAG}"
          git push origin "$TAG"

          cat > .work/release-notes.md <<NOTES
          ## Wuwa Tappo Global · macOS

          Automatic release for official Global resources ${VERSION}.

          - Apple Silicon, macOS 13 or later.
          - Includes the Global frontend and runtime assets.
          - Requires Input Monitoring for global keyboard and mouse counting.
          - This build is development/ad-hoc signed and is not notarized.
          - Community rebuild; not an official Kuro Games macOS client.

          ## ภาษาไทย

          รีลีสอัตโนมัติสำหรับ resource ของ Global เวอร์ชัน ${VERSION}

          - รองรับ Apple Silicon และ macOS 13 ขึ้นไป
          - รวม frontend และ runtime ของ Global ไว้ในแอปแล้ว
          - ต้องเปิด Input Monitoring เพื่อใช้นับคีย์บอร์ดและเมาส์ทั่วระบบ
          - รุ่นนี้ sign แบบ development/ad-hoc และยังไม่ได้ notarize
          - เป็น community rebuild ไม่ใช่แอป macOS อย่างเป็นทางการจาก Kuro Games
          NOTES
          gh release create "$TAG" dist/*.zip dist/*.dmg \
            --target "$COMMIT" \
            --title "Wuwa Tappo Global Mac ${TAG}" \
            --notes-file .work/release-notes.md \
            --latest
          echo "Published $TAG for official Global ${VERSION}"
      - name: Report incompatible or unavailable upstream
        if: failure()
        run: |
          set -euo pipefail
          TITLE='Global 官方同步需要处理'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="官方同步或兼容性验证失败，未发布新版本。请查看运行日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
